name: SingAndGuess
options:
  bundleIdPrefix: com.skat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateInfoPlist: false
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: SingAndGuess/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  SingAndGuess:
    type: application
    platform: iOS
    sources:
      - path: SingAndGuess
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skat.singandguess
        PRODUCT_NAME: 你唱我猜
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
